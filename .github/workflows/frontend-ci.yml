# Archivo: .github/workflows/frontend-ci.yml
name: Node.js CI

on:
  push:
    branches: [ "main", "develop" ] # ⬅️ Agregamos develop aquí
  pull_request:
    branches: [ "main", "develop" ] # ⬅️ Agregamos develop aquí

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x # ⬅️ Fijamos una sola versión para que sea veloz
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    # === ETAPA: LINT (Exigido por la rúbrica) ===
    - name: Run Linters (ESLint)
      run: npm run lint --if-present

    # === ETAPA: BUILD (Exigido por la rúbrica) ===
    - name: Build Source Code
      run: npm run build --if-present
      
    # === ETAPA: TEST (Exigido por la rúbrica) ===
    - name: Run Tests
      run: npm test --if-present
